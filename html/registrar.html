<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse · Getsemaní</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #f7f4ef;
            --card:      #ffffff;
            --ink:       #1a1a2e;
            --muted:     #7a7a8c;
            --accent:    #3d6b8e;
            --accent-h:  #2c506b;
            --border:    #e0dbd2;
            --shadow:    0 8px 32px rgba(26,26,46,0.10);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(61,107,142,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(61,107,142,0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 44px 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            animation: rise 0.4s ease both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 14px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--ink);
            letter-spacing: -0.3px;
        }

        .brand p {
            font-size: 14px;
            color: var(--muted);
            margin-top: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 7px;
            letter-spacing: 0.2px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--ink);
            background: #fafaf8;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61,107,142,0.12);
            background: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover  { background: var(--accent-h); }
        .btn-primary:active { transform: scale(0.98); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 20px;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider p {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .footer-links {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover { text-decoration: underline; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">
        <div class="brand-icon">🗺️</div>
        <h1>Crear cuenta</h1>
        <p>Únete y comparte tu experiencia en Getsemaní</p>
    </div>

    <form onsubmit="event.preventDefault(); registrarUsuario();">
        <div class="row">
            <div class="field">
                <label for="nombre">Nombre(s)</label>
                <input type="text" id="nombre" placeholder="Juan" required>
            </div>
            <div class="field">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Pérez" required>
            </div>
        </div>
        <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
        </div>
        <button class="btn-primary" type="submit">Crear cuenta</button>
    </form>

    <div class="divider">
        <span></span><p>¿Ya tienes cuenta?</p><span></span>
    </div>

    <div class="footer-links">
        <a href="login.html">Iniciar sesión</a>
    </div>

    <a class="back-link" href="../mapa.html">← Volver al mapa</a>
</div>

<script src="../js/auth.js"></script>
<script>
function registrarUsuario() {
    const nombre    = document.getElementById('nombre').value;
    const apellidos = document.getElementById('apellidos').value;
    const email     = document.getElementById('email').value;
    const password  = document.getElementById('password').value;
    registrar(nombre, apellidos, email, password);
}
</script>
</body>
</html>
