<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calificar Punto</title>
    <link rel="stylesheet" href="../estilos.css">
    <style>
        body { background:#f5f5f5; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .box { background:white; border-radius:10px; padding:30px; width:360px; box-shadow:0 0 15px rgba(0,0,0,0.1); text-align:center; }
        h2 { color:#2c3e50; margin-bottom:5px; }
        .nombre-punto { color:#7f8c8d; font-size:14px; margin-bottom:20px; }
        .estrellas { display:flex; justify-content:center; gap:8px; margin:15px 0; font-size:36px; cursor:pointer; }
        .estrellas span { transition:transform 0.1s; color:#ddd; }
        .estrellas span.activa { color:#f1c40f; }
        .estrellas span:hover { transform:scale(1.2); }
        textarea { width:100%; height:100px; margin:10px 0; padding:10px; border:2px solid #ddd; border-radius:6px; font-family:Arial,sans-serif; font-size:14px; resize:vertical; box-sizing:border-box; }
        button { width:100%; padding:12px; background:#3498db; color:white; border:none; border-radius:6px; font-size:15px; cursor:pointer; font-weight:bold; }
        button:hover { background:#2980b9; }
        .links-nav { margin-top:15px; font-size:13px; }
        .links-nav a { color:#3498db; text-decoration:none; }
        .links-nav a:hover { text-decoration:underline; }
    </style>
</head>
<body>

<div class="box">
    <h2>⭐ Calificar punto</h2>
    <p class="nombre-punto" id="nombre-punto">Cargando...</p>

    <p><strong>Selecciona una calificación:</strong></p>

    <!-- Las 5 estrellas, cada una tiene un data-valor del 1 al 5 -->
    <div class="estrellas" id="estrellas">
        <span data-valor="1">★</span>
        <span data-valor="2">★</span>
        <span data-valor="3">★</span>
        <span data-valor="4">★</span>
        <span data-valor="5">★</span>
    </div>

    <textarea id="resena" placeholder="Escribe tu reseña aquí (opcional)..."></textarea>

    <button onclick="guardarResena()">Enviar calificación</button>

    <div class="links-nav">
        <a href="../mapa.html">⬅ Volver al mapa</a>
        &nbsp;|&nbsp;
        <a id="link-resenas" href="#">Ver reseñas</a>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/local-api.js"></script>
<script src="../js/auth.js"></script>
<script>
    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    if (!usuario) window.location.href = "login.html";

    const params    = new URLSearchParams(window.location.search);
    const idPdi     = params.get("id_pdi");
    const nombrePunto = params.get("nombre");

    if (!idPdi) window.location.href = "../mapa.html";

    document.getElementById("nombre-punto").textContent = nombrePunto;
    document.getElementById("link-resenas").href =
        `resenas.html?id_pdi=${idPdi}&nombre=${encodeURIComponent(nombrePunto)}`;

    // Estrellas
    let calificacionSeleccionada = 0;
    const todasLasEstrellas = document.querySelectorAll("#estrellas span");

    function pintarEstrellas(n) {
        todasLasEstrellas.forEach((e, i) => e.classList.toggle("activa", i < n));
    }

    todasLasEstrellas.forEach(estrella => {
        estrella.addEventListener("mouseover", () => pintarEstrellas(estrella.dataset.valor));
        estrella.addEventListener("mouseout",  () => pintarEstrellas(calificacionSeleccionada));
        estrella.addEventListener("click", () => {
            calificacionSeleccionada = parseInt(estrella.dataset.valor);
            pintarEstrellas(calificacionSeleccionada);
        });
    });

    async function guardarResena() {
        if (calificacionSeleccionada === 0) {
            alert("Selecciona al menos 1 estrella.");
            return;
        }

        const comentario = document.getElementById("resena").value.trim();

        try {
            const res = await fetch(`${API_URL}/resenas.php`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id_pdi:     parseInt(idPdi),
                    id_cliente: usuario.id_cliente,
                    puntuacion: calificacionSeleccionada,
                    comentario
                })
            });

            const data = await res.json();

            if (!res.ok) {
                alert(data.error || "Error al guardar la reseña");
                return;
            }

            alert("¡Gracias por tu reseña, " + usuario.nombre + "!");
            window.location.href = "../mapa.html";

        } catch (e) {
            alert("Error de conexión");
            console.error(e);
        }
    }
</script>

</body>
</html>
