<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseñas</title>
    <link rel="stylesheet" href="../estilos.css">
    <style>
        body { background:#f5f5f5; padding:30px 20px; }
        .contenedor-resenas { max-width:700px; margin:0 auto; background:white; border-radius:10px; padding:30px; box-shadow:0 0 15px rgba(0,0,0,0.1); }
        h2 { color:#2c3e50; }
        .nombre-punto { color:#7f8c8d; margin-bottom:25px; font-size:15px; }
        .tarjeta-resena { border:1px solid #ddd; border-radius:8px; padding:15px; margin-bottom:15px; }
        .cabecera-resena { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .nombre-usuario { font-weight:bold; color:#2c3e50; }
        .fecha-resena { font-size:12px; color:#95a5a6; }
        .estrellas-resena { color:#f1c40f; font-size:18px; margin-bottom:6px; }
        .texto-resena { color:#555; font-size:14px; line-height:1.5; }
        .sin-resenas { text-align:center; color:#95a5a6; padding:40px 0; font-size:15px; }
        .promedio-global { background:#eaf4fb; border-radius:8px; padding:15px; text-align:center; margin-bottom:20px; }
        .promedio-numero { font-size:36px; font-weight:bold; color:#2c3e50; }
        .promedio-estrellas { font-size:24px; color:#f1c40f; }
        .promedio-total { color:#7f8c8d; font-size:13px; }
        .nav-links { margin-top:20px; }
        .nav-links a { color:#3498db; text-decoration:none; font-size:14px; margin-right:15px; }
        .nav-links a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    
<div class="contenedor-resenas">
    <h2>💬 Reseñas</h2>
    <p class="nombre-punto" id="nombre-punto">Cargando...</p>

    <div class="promedio-global" id="bloque-promedio" style="display:none;">
        <div class="promedio-numero"  id="promedio-numero"></div>
        <div class="promedio-estrellas" id="promedio-estrellas"></div>
        <div class="promedio-total"   id="promedio-total"></div>
    </div>

    <div id="lista-resenas"></div>

    <div class="nav-links">
        <a id="link-calificar" href="#">⭐ Calificar este punto</a>
        <a href="../mapa.html">⬅ Volver al mapa</a>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/local-api.js"></script>
<script>
    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    if (!usuario) window.location.href = "login.html";

    const params      = new URLSearchParams(window.location.search);
    const idPdi       = params.get("id_pdi");
    const nombrePunto = params.get("nombre");

    if (!idPdi) window.location.href = "../mapa.html";

    document.getElementById("nombre-punto").textContent = nombrePunto;
    document.getElementById("link-calificar").href =
        `calificar.html?id_pdi=${idPdi}&nombre=${encodeURIComponent(nombrePunto)}`;

    function generarEstrellas(n) {
        let s = "";
        for (let i = 1; i <= 5; i++) s += i <= n ? "★" : "☆";
        return s;
    }

    async function cargarResenas() {
        try {
            const res  = await fetch(`${API_URL}/resenas.php?id_pdi=${idPdi}`);
            const data = await res.json();

            const lista = document.getElementById("lista-resenas");

            if (data.total === 0) {
                lista.innerHTML = `
                    <div class="sin-resenas">
                        <p>Aún no hay reseñas para este punto.<br>¡Sé el primero en calificarlo!</p>
                    </div>`;
                return;
            }

            // Promedio
            document.getElementById("bloque-promedio").style.display = "block";
            document.getElementById("promedio-numero").textContent   = data.promedio;
            document.getElementById("promedio-estrellas").textContent = generarEstrellas(Math.round(data.promedio));
            document.getElementById("promedio-total").textContent =
                `Basado en ${data.total} reseña${data.total > 1 ? "s" : ""}`;

            // Tarjetas
            data.resenas.forEach(r => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "tarjeta-resena";
                tarjeta.innerHTML = `
                    <div class="cabecera-resena">
                        <span class="nombre-usuario">👤 ${r.usuario}</span>
                        <span class="fecha-resena">${new Date(r.fecha).toLocaleDateString("es-CO")}</span>
                    </div>
                    <div class="estrellas-resena">${generarEstrellas(r.puntuacion)}</div>
                    ${r.comentario
                        ? `<p class="texto-resena">${r.comentario}</p>`
                        : `<p class="texto-resena" style="color:#bbb;font-style:italic;">Sin comentario escrito.</p>`}
                `;
                lista.appendChild(tarjeta);
            });

        } catch (e) {
            console.error("Error cargando reseñas:", e);
        }
    }

    cargarResenas();
</script>

</body>
</html>
