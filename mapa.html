<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntos de Interés en Getsemaní</title>  
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- Tus estilos -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <script src="js/auth.js"></script> <!--N-->

    <div class="contenedor">
        <h1>Puntos de Interés en el barrio Getsemaní</h1>
        <div class="filtros">
            <button data-tipo="Todos">Todos</button>
            <button data-tipo="Restaurante">Restaurantes</button>
            <button data-tipo="Bar">Bares</button>
            <button data-tipo="Tienda">Tiendas</button>
            <button data-tipo="Café">Cafés</button>
            <button data-tipo="Hostal">Hostales</button>
            <button data-tipo="Licorería">Licorerías</button>
            <span class="filtro-sep" aria-hidden="true"></span>
            <button id="btn-promo-filtro" class="btn-promo-filtro">🏷️ Promociones</button>
        </div>
        <div id="mapa"></div>
    </div>

    <button id="btn-login">Iniciar sesión</button>
    <!-- Solo visible para vendedores — se activa desde main.js -->
    <button id="btn-vendedor">🏪 Crear Promoción</button>
    <!-- Solo visible para admins — se activa desde main.js -->
    <button id="btn-admin">⚙️ Panel Admin</button>
    <!-- Solo visible para administradores — se activa desde main.js -->
    <button id="btn-admin">⚙️ Panel de Administrador</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <!-- Tu JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
